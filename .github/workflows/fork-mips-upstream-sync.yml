name: Fork MIPS upstream synchronization

on:
  push:
    branches: [ci/mips-upstream-sync]
    paths: [.github/workflows/fork-mips-upstream-sync.yml]

permissions:
  contents: read

concurrency:
  group: fork-mips-upstream-sync
  cancel-in-progress: false

env:
  MERGE_SHA: 2b7f9586d4f5aad0b4220de2f8971aac5d1c00ae
  UPSTREAM_SHA: 81cdafc132c7ba3bd6e12b1169f9e3687025d07b
  INTEGRATION_BRANCH: integration/mips-upstream-81cdafc-fix1
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.correct.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b7f9586d4f5aad0b4220de2f8971aac5d1c00ae
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the inspected integration correction and regression
        id: correct
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^2)" = "$UPSTREAM_SHA"
          git config --local core.hooksPath /dev/null
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$INTEGRATION_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ghidra/GhidraInstallation.ts')
          text = path.read_text()
          before = '!alternative.value.availableArchitectures.includes(expectedArchitecture)'
          after = '!alternative.value.availableArchitectures.some(\n          (available) => available === expectedArchitecture,\n        )'
          assert text.count(before) == 1, 'Expected exactly one inspected membership check'
          path.write_text(text.replace(before, after))
          path = Path('src/ghidra/GhidraInstallation.test.ts')
          text = path.read_text()
          anchor = 'describe("Ghidra native decompiler admission", () => {\n  it.each([\n'
          addition = '''    {
                name: "a MIPS decompiler at the Linux x64 path",
                options: {
                  environment: {},
                  installDir: INSTALL,
                  platform: "linux" as const,
                  architecture: "x64" as const,
                },
                executableHeader: (path: string) =>
                  path === LINUX_DECOMPILER
                    ? { bytes: elf(1, 1, 8), size: 52 }
                    : undefined,
              },
          '''
          import textwrap
          addition = textwrap.dedent(addition)
          addition = ''.join('    ' + line if line.strip() else line for line in addition.splitlines(keepends=True))
          assert text.count(anchor) == 1, 'Expected exactly one native-tool table'
          path.write_text(text.replace(anchor, anchor + addition))
          PY
          git diff --check
          git diff --stat
          git diff -- src/ghidra/GhidraInstallation.ts src/ghidra/GhidraInstallation.test.ts
          git add src/ghidra/GhidraInstallation.ts src/ghidra/GhidraInstallation.test.ts
          git commit -m 'fix(ghidra): preserve native-tool architecture checks after MIPS integration' -m 'The conflict-free upstream merge failed TypeScript compilation because includes on the union of MIPS-only and other architecture arrays requires never. Use equality-based membership without casts or changing accepted native hosts. Extend the existing native-decompiler rejection table with a MIPS executable at a Linux x64 tool path; retain upstream FAT and unknown-header behavior. Hosted verification follows this commit; no success is claimed yet.'
          mkdir -p "$RUNNER_TEMP/mips-sync"
          git show --stat HEAD | tee "$RUNNER_TEMP/mips-sync/correction.txt"
          git diff --binary "$UPSTREAM_SHA" HEAD > "$RUNNER_TEMP/mips-sync/contribution.patch"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
      - name: Publish only the temporary integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$INTEGRATION_BRANCH" in integration/mips-upstream-81cdafc-fix1) ;; *) exit 1;; esac
          existing=$(git ls-remote https://github.com/jaelliot/rea.git "refs/heads/$INTEGRATION_BRANCH" | cut -f1)
          test -z "$existing"
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push https://github.com/jaelliot/rea.git "HEAD:refs/heads/$INTEGRATION_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mips-sync-preparation
          path: ${{ runner.temp }}/mips-sync/
          retention-days: 7

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Locked source and build
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mips-result" "$RUNNER_TEMP/mips-native-tmp"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/mips-result/source-sha.txt"
          node --version
          npm --version
          npm ci
          npm run build:cached
      - name: Focused actual tests and all current static gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:focused -- src/domain/binaryTarget.mips.test.ts src/ghidra/GhidraMipsProfile.test.ts src/ghidra/GhidraProvider.behavior.test.ts src/ghidra/GhidraInstallation.test.ts src/hopper/HopperMachOImage.test.ts tests/boundary/filesystem/mipsAbiFlags.test.ts tests/composition/analysis-sessions/mips-identity.test.ts tests/conformance/ghidra/mips-checks.test.ts 2>&1 | tee "$RUNNER_TEMP/mips-result/focused.log"
          npm run check:ci 2>&1 | tee "$RUNNER_TEMP/mips-result/check-ci.log"
          npm run verify:test-discovery 2>&1 | tee "$RUNNER_TEMP/mips-result/discovery.log"
          npm run docs:check 2>&1 | tee "$RUNNER_TEMP/mips-result/docs-check.log"
      - name: Provision only this disposable verification runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/mips-result/java.txt"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 lld-18 binutils
          echo "REA_MIPS_CLANG=clang-18" >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
          clang-18 --version | tee "$RUNNER_TEMP/mips-result/clang.txt"
          ld.lld-18 --version | tee "$RUNNER_TEMP/mips-result/lld.txt"
          readelf --version | tee "$RUNNER_TEMP/mips-result/readelf.txt"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o "$RUNNER_TEMP/ghidra.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/mips-native-tmp" >> "$GITHUB_ENV"
      - name: Real MIPS little-endian and big-endian public CLI and MCP
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs 2>&1 | tee "$RUNNER_TEMP/mips-result/real-ghidra.log"
          git diff --exit-code
      - name: Preserve bounded diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mips-result"
          git status --short > "$RUNNER_TEMP/mips-result/git-status.txt"
          ps -eo pid,ppid,stat > "$RUNNER_TEMP/mips-result/processes.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mips-sync-validation
          path: ${{ runner.temp }}/mips-result/
          if-no-files-found: error
          retention-days: 7
