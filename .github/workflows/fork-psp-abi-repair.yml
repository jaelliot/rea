name: Fork PSP ABI repair validation

on:
  push:
    branches: [ci/psp-public-validation]
    paths: [.github/workflows/fork-psp-abi-repair.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      SOURCE_SHA: c07024dec5cc59e23e2645293f8bd54252a6390a
      CANDIDATE_BRANCH: fix/psp-abi-record-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c07024dec5cc59e23e2645293f8bd54252a6390a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply bounded repair and format only touched source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psp-results" "$RUNNER_TEMP/psp-runtime"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python ../control/.github/psp-abi-repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/boundary/filesystem/ghidraPspExtension.test.ts')
          s = p.read_text()
          old = '      expect(parsed.value.mips?.abiFlags).toEqual(pspAbiFlags);'
          new = '''      if (parsed.value.kind !== "executable" || parsed.value.architecture !== "mips")
                  throw new Error("PSP ELF was not recognized as MIPS");
                expect(parsed.value.mips.abiFlags).toEqual(pspAbiFlags);'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          npm ci
          mapfile -t files < /tmp/psp-repair-files.txt
          npm exec oxfmt -- --write "${files[@]}"
          node --check tests/conformance/ghidra/psp-fixture.mjs
          node --check scripts/verify-real-ghidra-mips.mjs
          git diff --check
          git diff --exit-code -- src/ghidra/GhidraMipsProfile.ts
          cp /tmp/psp-repair-files.txt "$RUNNER_TEMP/psp-results/changed-files.txt"
          git add -- "${files[@]}"
          git diff --cached --binary > "$RUNNER_TEMP/psp-results/repair.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ghidra): validate PSPSDK ABI records in PSP admission'
          git rev-parse HEAD | tee "$RUNNER_TEMP/psp-results/source-sha.txt"
      - name: Publish isolated candidate branch without changing the PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "$CANDIDATE_BRANCH")"
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
      - name: Build and run existing static gates
        shell: bash
        run: |
          set -euo pipefail
          npm run build:cached 2>&1 | tee "$RUNNER_TEMP/psp-results/build.log"
          npm run check:ci 2>&1 | tee "$RUNNER_TEMP/psp-results/check-ci.log"
      - name: Actual focused regression tests and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:focused -- tests/boundary/filesystem/ghidraPspExtension.test.ts tests/conformance/ghidra/psp-checks.test.ts tests/boundary/providers/ghidra/ghidraLauncher.test.ts src/domain/binaryTarget.mips.test.ts src/ghidra/GhidraMipsProfile.test.ts src/ghidra/GhidraProvider.behavior.test.ts src/hopper/HopperMachOImage.test.ts tests/boundary/filesystem/mipsAbiFlags.test.ts tests/composition/analysis-sessions/mips-identity.test.ts tests/conformance/ghidra/mips-checks.test.ts 2>&1 | tee "$RUNNER_TEMP/psp-results/focused.log"
          npm run verify:test-discovery 2>&1 | tee "$RUNNER_TEMP/psp-results/discovery.log"
          npm run docs:check 2>&1 | tee "$RUNNER_TEMP/psp-results/docs.log"
      - name: Provision checksum-pinned verification tools on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/psp-results/java.txt"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 lld-18 binutils libgmp10 libmpfr6 libmpc3 libreadline-dev libusb-dev
          echo 'REA_MIPS_CLANG=clang-18' >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o "$RUNNER_TEMP/psp-ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/psp-ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/psp-ghidra.zip" -d "$RUNNER_TEMP/psp-ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/psp-ghidra/ghidra_12.1.3_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/pspdev/pspdev/releases/download/v20261001/pspdev-ubuntu-latest-x86_64.tar.gz' -o "$RUNNER_TEMP/pspdev.tar.gz"
          echo "a86efe624e770005290919617859e9df24bd8fcd3e364f4587f23ec7364b0acd  $RUNNER_TEMP/pspdev.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/psp-tools"
          tar -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP/psp-tools"
          PSPDEV_DIR="$RUNNER_TEMP/psp-tools/pspdev"
          test -x "$PSPDEV_DIR/bin/psp-gcc"
          echo "PSPDEV=$PSPDEV_DIR" >> "$GITHUB_ENV"
          echo "$PSPDEV_DIR/bin" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/psp-runtime" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 90 'https://github.com/kotcrab/ghidra-allegrex/releases/download/v21.4/ghidra_12.1.3_PUBLIC_20260825_ghidra-allegrex.zip' -o "$RUNNER_TEMP/allegrex.zip"
          echo "62e829fa9e6ed6f2bd343763fb339a3f8812b02a4e0ed5a9409b14007b408243  $RUNNER_TEMP/allegrex.zip" | sha256sum --check
          sha256sum "$RUNNER_TEMP/psp-ghidra.zip" "$RUNNER_TEMP/pspdev.tar.gz" "$RUNNER_TEMP/allegrex.zip" > "$RUNNER_TEMP/psp-results/tool-archives.sha256"
      - name: Public CLI and MCP missing-extension refusals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs --psp-missing-extension 2>&1 | tee "$RUNNER_TEMP/psp-results/missing-extension.log"
      - name: Install extension only in disposable Ghidra
        id: extension_install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
          unzip -q "$RUNNER_TEMP/allegrex.zip" -d "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
          test -f "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/ghidra-allegrex/extension.properties"
      - name: Real PSP CLI MCP and snapshot A-B-A identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs --psp 2>&1 | tee "$RUNNER_TEMP/psp-results/psp-public.log"
      - name: Real generic LE and BE MIPS remain separate
        if: ${{ !cancelled() && steps.extension_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs 2>&1 | tee "$RUNNER_TEMP/psp-results/generic-mips.log"
      - name: Preserve compact diagnostics and source cleanliness
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/psp-results/logs"
          git status --short > "$RUNNER_TEMP/psp-results/git-status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/psp-results/final-source-sha.txt"
          if test -d "$RUNNER_TEMP/psp-runtime"; then
            find "$RUNNER_TEMP/psp-runtime" -type f -name '*.log' -size -2M -exec cp --parents '{}' "$RUNNER_TEMP/psp-results/logs/" \;
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psp-abi-repair-verification
          path: ${{ runner.temp }}/psp-results/
          if-no-files-found: error
          retention-days: 3
  baseline-diagnostics:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: morluto/rea
          ref: 6d8f95e38dfc847d911430483b812ff4951b373d
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Compare existing upstream and PR job failures without rerunning suites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-results"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'baseline-results'
          jobs = {
            'static': (114256248675, 114258379897),
            'apple': (114256248711, 114258379912),
            'windows': (114256403089, 114258516787),
            'shard2': (114256344500, 114258473209),
            'shard3': (114256344536, 114258473150),
            'shard4': (114256344502, 114258473166),
          }
          summary = {}
          for name, pair in jobs.items():
            summary[name] = {}
            for side, job in zip(('base', 'pr'), pair):
              result = subprocess.run(['gh','api',f'/repos/morluto/rea/actions/jobs/{job}/logs'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                raise RuntimeError(f'Cannot inspect {side} {name} job {job}: {result.stderr}')
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', result.stdout)
              lines = [re.sub(r'^\d{4}-\d\d-\d\dT[^ ]+ ', '', line) for line in text.splitlines()]
              selected = set()
              for i,line in enumerate(lines):
                if re.search(r'\bFAIL\b|AssertionError|\[error\]|HEAD is now at|Failed Tests|Tests .*failed|Test Files .*failed|Failed:.*format', line):
                  selected.update(range(max(0,i-1),min(len(lines),i+45)))
              excerpt = '\n'.join(lines[i] for i in sorted(selected))
              (root / f'{side}-{name}.txt').write_text(excerpt)
              failures = [line.strip() for line in lines if re.search(r'\bFAIL\b|AssertionError|Tests .*failed|Test Files .*failed|Failed:.*format', line)]
              summary[name][side] = {'job': job, 'signatures': failures}
          (root / 'failure-signatures.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Record exact base formatting failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/baseline-results/base-source-sha.txt"
          npm ci
          npm exec oxfmt -- --check . 2>&1 | tee "$RUNNER_TEMP/baseline-results/base-format.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-baseline-failure-diagnostics
          path: ${{ runner.temp }}/baseline-results/
          if-no-files-found: error
          retention-days: 3
