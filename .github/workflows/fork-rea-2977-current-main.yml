name: Fork REA 2977 current-main validation

on:
  push:
    branches: [ci/rea-2977-main-20261103]
    paths: [.github/workflows/fork-rea-2977-current-main.yml]

permissions:
  contents: read

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  SOURCE_SHA: 150f6f2123e0ce698107b8cd2402dcdd655f556f
  GHIDRA_RELEASE_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_RELEASE_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

jobs:
  current-main:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate exact source, build, formatting and focused feature tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci
          npm run build:cached
          npm run check:fast
          npm run format:check
          npm run docs:check
          npm run test:focused -- src/application/native/NativeApiInspection.test.ts src/ghidra/GhidraFunctionValues.test.ts src/ghidra/GhidraProvider.behavior.test.ts src/ghidra/GhidraRawProfileDigest.test.ts src/ghidra/GhidraSnapshotCache.test.ts src/application/WorkflowEvidence.test.ts
      - name: Confirm pinned Ghidra SDK configuration
        shell: bash
        run: node scripts/verify-ghidra-bridge-sources.mjs --check-sdk-pin >> "$GITHUB_ENV"
      - name: Download checksum-verified Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rea-ghidra"
          mkdir -p "$root"
          curl -fsSL --retry 3 -o "$root/ghidra.zip" "$GHIDRA_RELEASE_URL"
          echo "$GHIDRA_RELEASE_SHA256  $root/ghidra.zip" | sha256sum -c -
          unzip -q "$root/ghidra.zip" -d "$root"
          rm "$root/ghidra.zip"
          properties="$(find "$root" -path '*/Ghidra/application.properties' -print -quit)"
          test -n "$properties"
          echo "GHIDRA_INSTALL_DIR=$(dirname "$(dirname "$properties")")" >> "$GITHUB_ENV"
          java_home_variable="JAVA_HOME_${GHIDRA_JAVA_MAJOR}_X64"
          test -n "${!java_home_variable}"
          echo "JAVA_HOME=${!java_home_variable}" >> "$GITHUB_ENV"
      - name: Real Ghidra warning and computed-branch provenance regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-warning-attribution.mjs
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
