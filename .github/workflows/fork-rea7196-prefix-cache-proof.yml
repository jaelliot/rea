name: Fork-only REA #7196 cache-prefix verification

on:
  push:
    branches:
      - ci/rea7196-prefix-cache-proof-20261104

permissions:
  contents: read

jobs:
  library-cache:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD^
          git diff --exit-code 5d809bc5193e8285c51d835e2dbc23a5a0581a0d HEAD -- src/domain/native/libraryFunctionIdentification.ts src/domain/native/libraryFunctionIdentification.test.ts
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:cached
          npm run test:prepare
      - name: Focused library-matcher regressions
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/domain/native/libraryFunctionIdentification.test.ts
          npm run verify:test-discovery
      - name: Static and formatting checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check:fast -- --force
          npx oxfmt --check src/domain/native/libraryFunctionIdentification.ts src/domain/native/libraryFunctionIdentification.test.ts
          git diff --check
