name: REA 2977 real warning provenance

on:
  push:
    branches:
      - codex/rea-2977-warning-provenance-ci-20261023

permissions:
  contents: read

env:
  HUSKY: "0"
  GHIDRA_RELEASE_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_RELEASE_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

jobs:
  real-ghidra:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate pinned Ghidra SDK policy
        run: node scripts/verify-ghidra-bridge-sources.mjs --check-sdk-pin >> "$GITHUB_ENV"
      - name: Acquire checksum-verified real Ghidra 12.1.4
        shell: bash
        run: |
          ghidra_root="${RUNNER_TEMP}/rea-ghidra"
          mkdir -p "${ghidra_root}"
          curl -fsSL --retry 3 -o "${ghidra_root}/ghidra.zip" "${GHIDRA_RELEASE_URL}"
          echo "${GHIDRA_RELEASE_SHA256}  ${ghidra_root}/ghidra.zip" | sha256sum -c -
          unzip -q "${ghidra_root}/ghidra.zip" -d "${ghidra_root}"
          rm "${ghidra_root}/ghidra.zip"
          properties="$(find "${ghidra_root}" -path '*/Ghidra/application.properties' -print -quit)"
          test -n "${properties}"
          echo "GHIDRA_INSTALL_DIR=$(dirname "$(dirname "${properties}")")" >> "$GITHUB_ENV"
          java_home_variable="JAVA_HOME_${GHIDRA_JAVA_MAJOR}_X64"
          test -n "${!java_home_variable}"
          echo "JAVA_HOME=${!java_home_variable}" >> "$GITHUB_ENV"
      - name: Verify real Ghidra AArch64 warning provenance
        run: npm run verify:ghidra:aarch64-jump-table
      - name: Focused native API and evidence regressions
        run: |
          npm run test:focused -- \
            src/application/native/NativeApiInspection.test.ts \
            src/ghidra/GhidraFunctionValues.test.ts \
            src/application/WorkflowEvidence.test.ts \
            src/application/binary/AnalysisSnapshotCache.test.ts \
            tests/boundary/filesystem/directAnalysisSnapshotReplay.test.ts \
            tests/boundary/mcp/enhancedTools.01-lists-the-complete-target-open.test.ts \
            tests/boundary/mcp/ghidraNativeApiMcp.test.ts
      - name: Verify TypeScript and lint
        run: npm run check:fast
