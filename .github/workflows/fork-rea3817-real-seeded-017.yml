name: Fork REA real Ghidra saved seed acceptance

on:
  push:
    branches:
      - codex/rea3817-real-seeded-017

permissions:
  contents: read

concurrency:
  group: fork-rea3817-real-seeded-017
  cancel-in-progress: true

jobs:
  real-ghidra:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build source and verify client/seed regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          npm --version
          npm ci
          npm run build:cached
          npm run test:prepare
          npx vitest run src/ghidra/GhidraProvider.behavior.test.ts src/ghidra/GhidraAnalysisSeeds.test.ts
          node --check scripts/verify-real-ghidra-persistent.mjs
          npm run check:fast -- --force
      - name: Download and verify exact Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          curl --fail --location --retry 2 --max-time 420 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o "$RUNNER_TEMP/ghidra-12.1.4.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra-12.1.4.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra-12.1.4.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rea-ghidra-report"
          sha256sum "$RUNNER_TEMP/ghidra-12.1.4.zip" > "$RUNNER_TEMP/rea-ghidra-report/tool-sha256.txt"
      - name: Existing real persistent project baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-persistent.mjs | tee "$RUNNER_TEMP/rea-ghidra-report/baseline.json"
      - name: Historical saved seed report through actual Ghidra
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-persistent.mjs --historical-seeds | tee "$RUNNER_TEMP/rea-ghidra-report/historical-seeds.json"
          node -e 'const x=require(process.argv[1]);if(!/^[a-f0-9]{64}$/.test(x.historical_seed_digest)||x.cleanup!=="complete")process.exit(1)' "$RUNNER_TEMP/rea-ghidra-report/historical-seeds.json"
      - name: Verify source cleanliness and record revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-ghidra-report"
          git rev-parse HEAD > "$RUNNER_TEMP/rea-ghidra-report/commit-sha.txt"
          git status --short > "$RUNNER_TEMP/rea-ghidra-report/git-status.txt"
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rea3817-real-seeded-017
          path: ${{ runner.temp }}/rea-ghidra-report/
          if-no-files-found: warn
          retention-days: 5
