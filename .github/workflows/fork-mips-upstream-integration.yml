name: Fork MIPS upstream integration

on:
  push:
    branches: [ci/mips-upstream-integration]
    paths: [.github/workflows/fork-mips-upstream-integration.yml]

permissions:
  contents: read

concurrency:
  group: fork-mips-upstream-integration
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  FEATURE_SHA: adf1cda29859ffcc063f40418b8ba39a0eac4fab
  UPSTREAM_SHA: 8550913cda311e5340cf012b9c4afd622e36e35b
  MERGE_SHA: 31a8944423687357adcc14e95b39a932e669c8ce

jobs:
  provenance:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.repair.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 31a8944423687357adcc14e95b39a932e669c8ce
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the reviewed two-file repair to the reproducible merge
        id: repair
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$FEATURE_SHA"
          test "$(git rev-parse HEAD^2)" = "$UPSTREAM_SHA"
          test "$(git merge-tree --write-tree "$FEATURE_SHA" "$UPSTREAM_SHA")" = "$(git rev-parse 'HEAD^{tree}')"
          git fetch --no-tags origin e22abec18335069b4e29d47c5d65e6b16966d08e
          git show e22abec18335069b4e29d47c5d65e6b16966d08e:.github/workflows/mips-integration-repair.patch > "$RUNNER_TEMP/integration/repair.patch"
          test "$(git hash-object "$RUNNER_TEMP/integration/repair.patch")" = b60d9083eda5b3a6e75de5f5908ba030b2e567a6
          git apply --index "$RUNNER_TEMP/integration/repair.patch"
          git diff --cached --check
          test "$(git write-tree)" = 2394389256fb3f813331a1fc9a8a038790144f1e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git commit -m 'fix(ghidra): preserve host-tool checks after MIPS integration' -m 'Use a type-safe membership predicate for the widened discriminated architecture union in upstream native-decompiler inspection. Add both-endian cases refusing a MIPS target at the Linux x64 decompiler path. The integrated build previously failed TS2345; 45 local actual Vitest installation cases passed with cached dependencies. Full locked and real-provider validation follows against this commit. No provider admission policy is broadened.'
          CANDIDATE=$(git rev-parse HEAD)
          git show --no-patch --format=fuller HEAD | tee "$RUNNER_TEMP/integration/candidate.txt"
          BRANCH=integration/mips-upstream-8550913
          EXISTING=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if test "$EXISTING" = "$MERGE_SHA"; then
            AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH"
            unset AUTH
          else
            git fetch --no-tags origin "refs/heads/$BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$EXISTING"
            test "$(git rev-parse "$EXISTING^1")" = "$MERGE_SHA"
            test "$(git rev-parse "$EXISTING^{tree}")" = 2394389256fb3f813331a1fc9a8a038790144f1e
            git switch --detach "$EXISTING"
          fi
          unset PUSH_TOKEN
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'source=%s\nmerge=%s\nfeature=%s\nupstream=%s\n' "$SOURCE_SHA" "$MERGE_SHA" "$FEATURE_SHA" "$UPSTREAM_SHA" | tee "$RUNNER_TEMP/integration/inputs.txt"
          git diff --stat "$UPSTREAM_SHA" HEAD | tee "$RUNNER_TEMP/integration/contribution-stat.txt"
          git diff --check "$UPSTREAM_SHA" HEAD
          git diff "$UPSTREAM_SHA" HEAD > "$RUNNER_TEMP/integration/contribution.diff"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/integration/source.tar.gz"
          echo "Source $SOURCE_SHA on upstream $UPSTREAM_SHA; only the temporary integration branch was updated." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mips-upstream-merge
          path: ${{ runner.temp }}/integration/
          if-no-files-found: error
          retention-days: 3

  deterministic:
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Locked dependencies and exact source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/results/source-sha.txt"
          node --version
          npm --version
          npm ci
      - name: Focused MIPS and affected production-boundary tests
        run: |
          set -euo pipefail
          npm run test:focused -- src/domain/binaryTarget.mips.test.ts src/ghidra/GhidraMipsProfile.test.ts src/ghidra/GhidraProvider.behavior.test.ts src/ghidra/GhidraInstallation.test.ts src/hopper/HopperMachOImage.test.ts tests/boundary/filesystem/mipsAbiFlags.test.ts tests/composition/analysis-sessions/mips-identity.test.ts tests/conformance/ghidra/mips-checks.test.ts 2>&1 | tee "$RUNNER_TEMP/results/focused.log"
      - name: Unchanged repository gates and generated contracts
        run: |
          set -euo pipefail
          npm run check:ci 2>&1 | tee "$RUNNER_TEMP/results/static.log"
          npm run verify:test-discovery 2>&1 | tee "$RUNNER_TEMP/results/discovery.log"
          npm run docs:check 2>&1 | tee "$RUNNER_TEMP/results/docs.log"
      - name: Complete actual Vitest suite with normal coverage gates
        run: |
          set -euo pipefail
          npm run test:coverage -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/results/test-results.json" 2>&1 | tee "$RUNNER_TEMP/results/full-tests.log"
      - name: Confirm tracked source unchanged
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          git status --short | tee "$RUNNER_TEMP/results/git-status.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mips-upstream-deterministic
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 3

  real-ghidra:
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Locked source and build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/mips-native-tmp"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/results/source-sha.txt"
          node --version
          npm --version
          npm ci
          npm run build:cached
      - name: Install pinned Ghidra only into the disposable runner
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/results/java.txt"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 lld-18 binutils
          echo 'REA_MIPS_CLANG=clang-18' >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
          clang-18 --version | tee "$RUNNER_TEMP/results/clang.txt"
          /usr/lib/llvm-18/bin/ld.lld --version | tee "$RUNNER_TEMP/results/lld.txt"
          readelf --version | tee "$RUNNER_TEMP/results/readelf.txt"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o "$RUNNER_TEMP/ghidra.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/mips-native-tmp" >> "$GITHUB_ENV"
      - name: Real little-endian and big-endian MIPS through public CLI and MCP
        run: |
          set -euo pipefail
          npm run verify:ghidra:mips 2>&1 | tee "$RUNNER_TEMP/results/real-ghidra.log"
      - name: Preserve compact diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results/logs"
          git status --short > "$RUNNER_TEMP/results/git-status.txt"
          ps -eo pid,ppid,stat > "$RUNNER_TEMP/results/processes.txt"
          if test -d "$RUNNER_TEMP/mips-native-tmp"; then
            find "$RUNNER_TEMP/mips-native-tmp" -type f -name '*.log' -size -2M -exec cp --parents '{}' "$RUNNER_TEMP/results/logs/" \;
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mips-upstream-real-ghidra
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 3
