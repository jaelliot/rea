name: Fork REA real copy-first restart acceptance

on:
  push:
    branches:
      - codex/rea2358-real-copy-restart-018

permissions:
  contents: read

concurrency:
  group: fork-rea2358-real-copy-restart-018
  cancel-in-progress: true

jobs:
  real-ghidra-restart:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build pinned REA and verify fixed session contracts
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          npm --version
          npm ci
          npm run build:cached
          npm run test:prepare
          node --check scripts/verify-real-ghidra-existing-copy-restart.mjs
          npx vitest run src/application/binary/BinarySessionLiveness.test.ts src/application/binary/AnalysisSnapshotCache.test.ts
          npm run check:fast -- --force
      - name: Obtain exact checksum-pinned Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          curl --fail --location --retry 2 --max-time 420 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o "$RUNNER_TEMP/ghidra-12.1.4.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra-12.1.4.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra-12.1.4.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rea-copy-restart"
          sha256sum "$RUNNER_TEMP/ghidra-12.1.4.zip" > "$RUNNER_TEMP/rea-copy-restart/ghidra-archive.sha256"
      - name: Real saved-project edit and same-session provider restart
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-existing-copy-restart.mjs | tee "$RUNNER_TEMP/rea-copy-restart/run.json"
          node -e 'const x=require(process.argv[1]);if(x.cleanup!=="complete"||!x.source_bytes_unchanged||!x.copy_profile_changed||x.old_profile_digest===x.new_profile_digest)process.exit(1)' "$RUNNER_TEMP/rea-copy-restart/run.json"
      - name: Preserve verification receipt and check repository state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-copy-restart"
          git rev-parse HEAD > "$RUNNER_TEMP/rea-copy-restart/commit.txt"
          git status --short > "$RUNNER_TEMP/rea-copy-restart/git-status.txt"
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rea2358-real-copy-restart-018
          path: ${{ runner.temp }}/rea-copy-restart/
          if-no-files-found: warn
          retention-days: 5
