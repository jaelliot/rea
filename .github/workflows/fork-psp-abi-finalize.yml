name: Fork PSP upstream integration verification

on:
  push:
    branches: [ci/psp-public-validation]
    paths: [.github/workflows/fork-psp-abi-finalize.yml]

permissions:
  contents: read

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  SOURCE_SHA: 2619488261fdfd7d09b50195712ee8bd5ed84e77
  UPSTREAM_SHA: 926c2d6ba7975522d63a8dbb0d448f5b9d1514d4
  CANDIDATE_BRANCH: test/psp-upstream-926c2d6

jobs:
  verify:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2619488261fdfd7d09b50195712ee8bd5ed84e77
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scope the generic carved-firmware verifier to its own fixture family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psp-results" "$RUNNER_TEMP/psp-runtime"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-real-ghidra-mips.mjs')
          s = p.read_text()
          start_marker = '      // Carved firmware keeps all program headers/load bytes but loses sections.\n'
          end_marker = '      reports.push({\n'
          assert s.count(start_marker) == 1, 'Expected one carved-firmware block'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          block = s[start:end]
          assert 'assertMipsLoadedImage(carvedImage.observations, byteOrder, carvedSha256)' in block
          assert 'independent.symbols.rea_mips_entry' in block
          field_start = s.index('        carved: {\n', end)
          field_end = s.index('        status: "passed",\n', field_start)
          field = s[field_start:field_end]
          assert field.endswith('        },\n')
          assignment = field.replace('        carved: {\n', '        carved = {\n', 1)[:-2] + ';\n'
          guarded = (
              '      // This upstream carved-firmware proof is specific to the generic MIPS fixture.\n'
              '      // PSP keeps its independent Allegrex/A-B-A checks; carved PSP is not verified.\n'
              '      let carved;\n'
              '      if (!psp) {\n'
              + ''.join('  ' + line if line.strip() else line for line in block.splitlines(keepends=True))
              + assignment + '      }\n'
          )
          replacement = (
              '        carved: carved ?? {\n'
              '          status: "not_run",\n'
              '          reason: "Carved-firmware verification covers generic MIPS fixtures; carved PSP coverage is not established.",\n'
              '        },\n'
          )
          assert s.count(field) == 1
          p.write_text(s.replace(block, guarded, 1).replace(field, replacement, 1))
          p = Path('docs/ghidra-psp.md')
          s = p.read_text()
          marker = 'The maintained PSP fixture builds from `tests/conformance/psp/`, never executes,\n'
          assert s.count(marker) == 1
          s = s.replace(marker, 'The generic verifier also exercises a section-truncated firmware fixture. That\ncheck uses generic MIPS symbols and language expectations and runs only in generic\nmode; the PSP report explicitly records carved-PSP coverage as not run.\n\n' + marker)
          p.write_text(s)
          PY
          npm ci
          npm exec oxfmt -- --write scripts/verify-real-ghidra-mips.mjs docs/ghidra-psp.md
          node --check scripts/verify-real-ghidra-mips.mjs
          git diff --check
          git diff --exit-code -- src/
          git diff > "$RUNNER_TEMP/psp-results/verifier-repair.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/verify-real-ghidra-mips.mjs docs/ghidra-psp.md
          git commit -m 'test(ghidra): keep carved firmware checks scoped to generic MIPS fixtures'
          git rev-parse HEAD | tee "$RUNNER_TEMP/psp-results/source-sha.txt"
          git show --no-patch --format=raw HEAD > "$RUNNER_TEMP/psp-results/parents.txt"
          git diff --stat "$UPSTREAM_SHA" HEAD > "$RUNNER_TEMP/psp-results/contribution-stat.txt"
      - name: Locked build and existing static gates
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm run build:cached 2>&1 | tee "$RUNNER_TEMP/psp-results/build.log"
          npm run check:ci 2>&1 | tee "$RUNNER_TEMP/psp-results/check-ci.log"
      - name: PSP regressions and the previously failing integration areas
        shell: bash
        run: |
          set -euo pipefail
          npm run test:focused -- tests/boundary/filesystem/ghidraPspExtension.test.ts tests/conformance/ghidra/psp-checks.test.ts tests/boundary/providers/ghidra/ghidraLauncher.test.ts src/domain/binaryTarget.mips.test.ts src/ghidra/GhidraMipsProfile.test.ts src/ghidra/GhidraProvider.behavior.test.ts src/hopper/HopperMachOImage.test.ts tests/boundary/filesystem/mipsAbiFlags.test.ts tests/composition/analysis-sessions/mips-identity.test.ts tests/conformance/ghidra/mips-checks.test.ts tests/boundary/evm/evmoleInterfaceProvider.test.ts tests/boundary/browser/cdpCleanupCancellation.test.ts tests/boundary/firmware/firmwareIntegration.test.ts tests/boundary/firmware/firmwareWorkspaceRecovery.test.ts tests/boundary/filesystem/qwenClientConfiguration.test.ts 2>&1 | tee "$RUNNER_TEMP/psp-results/focused.log"
          npm run verify:test-discovery 2>&1 | tee "$RUNNER_TEMP/psp-results/discovery.log"
          npm run docs:check 2>&1 | tee "$RUNNER_TEMP/psp-results/docs.log"
      - name: Advance only the isolated candidate with expected-head check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "$CANDIDATE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
      - name: Provision checksum-pinned verification tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/psp-results/java.txt"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 lld-18 binutils libgmp10 libmpfr6 libmpc3 libreadline-dev libusb-dev
          echo 'REA_MIPS_CLANG=clang-18' >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o "$RUNNER_TEMP/psp-ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/psp-ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/psp-ghidra.zip" -d "$RUNNER_TEMP/psp-ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/psp-ghidra/ghidra_12.1.3_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/pspdev/pspdev/releases/download/v20261001/pspdev-ubuntu-latest-x86_64.tar.gz' -o "$RUNNER_TEMP/pspdev.tar.gz"
          echo "a86efe624e770005290919617859e9df24bd8fcd3e364f4587f23ec7364b0acd  $RUNNER_TEMP/pspdev.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/psp-tools"
          tar -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP/psp-tools"
          PSPDEV_DIR="$RUNNER_TEMP/psp-tools/pspdev"
          test -x "$PSPDEV_DIR/bin/psp-gcc"
          echo "PSPDEV=$PSPDEV_DIR" >> "$GITHUB_ENV"
          echo "$PSPDEV_DIR/bin" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/psp-runtime" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 90 'https://github.com/kotcrab/ghidra-allegrex/releases/download/v21.4/ghidra_12.1.3_PUBLIC_20260825_ghidra-allegrex.zip' -o "$RUNNER_TEMP/allegrex.zip"
          echo "62e829fa9e6ed6f2bd343763fb339a3f8812b02a4e0ed5a9409b14007b408243  $RUNNER_TEMP/allegrex.zip" | sha256sum --check
          sha256sum "$RUNNER_TEMP/psp-ghidra.zip" "$RUNNER_TEMP/pspdev.tar.gz" "$RUNNER_TEMP/allegrex.zip" > "$RUNNER_TEMP/psp-results/tool-archives.sha256"
      - name: Public missing-extension refusals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs --psp-missing-extension 2>&1 | tee "$RUNNER_TEMP/psp-results/missing-extension.log"
      - name: Install extension in disposable Ghidra
        id: extension_install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
          unzip -q "$RUNNER_TEMP/allegrex.zip" -d "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
          test -f "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/ghidra-allegrex/extension.properties"
      - name: Real public PSP analysis and snapshot A-B-A identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs --psp 2>&1 | tee "$RUNNER_TEMP/psp-results/psp-public.log"
      - name: Real generic LE and BE MIPS including carved-firmware checks
        if: ${{ !cancelled() && steps.extension_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs 2>&1 | tee "$RUNNER_TEMP/psp-results/generic-mips.log"
      - name: Preserve diagnostics and verify source cleanliness
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/psp-results/logs"
          git status --short > "$RUNNER_TEMP/psp-results/git-status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/psp-results/final-source-sha.txt"
          if test -d "$RUNNER_TEMP/psp-runtime"; then
            find "$RUNNER_TEMP/psp-runtime" -type f -name '*.log' -size -2M -exec cp --parents '{}' "$RUNNER_TEMP/psp-results/logs/" \;
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psp-upstream-integration-926c2d6
          path: ${{ runner.temp }}/psp-results/
          if-no-files-found: error
          retention-days: 3
