name: Fork MIPS fix verification

on:
  push:
    branches: [ci/mips-validation]
    paths:
      - .github/workflows/fork-mips-validation.yml
      - validation/mips-ci-fix.patch

permissions:
  contents: read

concurrency:
  group: fork-mips-validation
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  SOURCE_SHA: e064d8473f80695332c81aa66a8bafd667e1db6d
  PATCH_SHA256: 48db673ea33018fc7a3ffb5ccf354cd5346879ecde2ef14cd9cf771a97392f54

jobs:
  verify:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exactly the reviewed patch to its original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-mips"
          cp validation/mips-ci-fix.patch "$RUNNER_TEMP/verified-mips/change.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/verified-mips/change.patch" | sha256sum --check
          git checkout --detach "$SOURCE_SHA"
          git apply --check "$RUNNER_TEMP/verified-mips/change.patch"
          git apply --index "$RUNNER_TEMP/verified-mips/change.patch"
          git write-tree > "$RUNNER_TEMP/verified-mips/tree-sha.txt"
          git diff --cached --check
          git diff --cached --stat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Repository static checks
        run: npm run check:ci
      - name: Confirm test discovery
        run: npm run verify:test-discovery
      - name: Real focused tests through production build
        run: npm run test:focused -- src/domain/binaryTarget.mips.test.ts src/ghidra/GhidraMipsProfile.test.ts src/hopper/HopperMachOImage.test.ts src/ghidra/GhidraProvider.behavior.test.ts tests/boundary/filesystem/mipsAbiFlags.test.ts tests/composition/analysis-sessions/mips-identity.test.ts
      - name: Generated metadata and documentation contracts
        run: npm run docs:check
      - name: Ensure validators did not edit the candidate
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-mips-patch
          path: ${{ runner.temp }}/verified-mips/
          if-no-files-found: error
          retention-days: 3

  stage-candidate:
    needs: verify
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e064d8473f80695332c81aa66a8bafd667e1db6d
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: verified-mips-patch
          path: /tmp/verified-mips
      - name: Stage tested code on a separate branch, never main or the PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "$PATCH_SHA256  /tmp/verified-mips/change.patch" | sha256sum --check
          git apply --index /tmp/verified-mips/change.patch
          test "$(git write-tree)" = "$(cat /tmp/verified-mips/tree-sha.txt)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(native): repair MIPS integration boundaries and test resolver behavior' -m 'Keep ELF targets out of the Hopper Mach-O preparation path and scope existing PE test fixtures to their supported architectures. Move filesystem ABI tests into the boundary lane, use shared test cleanup, add full target-resolver regressions, and apply the pinned formatter. Validated using the repository-pinned Node/npm, check:ci, focused Vitest, test discovery and docs:check. Real Ghidra conformance remains a separate gate.'
          BRANCH="ci/mips-tested-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Candidate branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format=fuller
