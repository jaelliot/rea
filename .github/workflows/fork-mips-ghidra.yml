name: Fork real MIPS Ghidra verification

on:
  push:
    branches: [ci/mips-validation]
    paths: [.github/workflows/fork-mips-ghidra.yml]

permissions:
  contents: read

concurrency:
  group: fork-real-mips-ghidra
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  real-ghidra:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03d82b75558f355702d0c8b01aa06552f30d73f5
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Locked runtime and build
        run: |
          node --version
          npm --version
          npm ci
          npm run build:cached
      - name: Provision only this ephemeral verification runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mips-result"
          git rev-parse HEAD | tee "$RUNNER_TEMP/mips-result/source-sha.txt"
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/mips-result/java.txt"
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y clang lld
          fi
          clang --version | tee "$RUNNER_TEMP/mips-result/clang.txt"
          ld.lld --version | tee "$RUNNER_TEMP/mips-result/lld.txt"
          URL='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip'
          curl --fail --location --retry 2 --max-time 180 "$URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mips-native-tmp"
          echo "TMPDIR=$RUNNER_TEMP/mips-native-tmp" >> "$GITHUB_ENV"
      - name: Real little-endian and big-endian public CLI/MCP verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs 2>&1 | tee "$RUNNER_TEMP/mips-result/real-ghidra.log"
      - name: Preserve diagnostics without claiming failed runs passed
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mips-result"
          ps -eo pid,ppid,stat,args > "$RUNNER_TEMP/mips-result/processes.txt"
          git status --short > "$RUNNER_TEMP/mips-result/git-status.txt"
          find "$RUNNER_TEMP/mips-native-tmp" -type f -name '*.log' -print 2>/dev/null > "$RUNNER_TEMP/mips-result/log-paths.txt" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-mips-ghidra-03d82b7
          path: |
            ${{ runner.temp }}/mips-result/
            ${{ runner.temp }}/mips-native-tmp/
          if-no-files-found: error
          retention-days: 3
