name: Fork PSP tooling validation

on:
  push:
    branches: [ci/psp-tooling-validation-20261101]
    paths: [.github/workflows/fork-psp-compatibility.yml]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'jaelliot/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: vfpu-refreshed
            source_sha: 36f1fed4f5b49290e3420d23e88600d9e55229d7
            baseline: true
          - feature: symbols-refreshed
            source_sha: 4969685685f41376ee356a316f542756976cf435
            baseline: true
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      SOURCE_SHA: ${{ matrix.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Source-only checks and locked build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/psp-results" "$RUNNER_TEMP/psp-runtime"
          node --check scripts/verify-real-ghidra-mips.mjs
          if test -f scripts/verify-psp-symbol-correlation.mjs; then
            node --check scripts/psp-symbol-correlation.mjs
            node scripts/verify-psp-symbol-correlation.mjs
          fi
          npm ci
          if test -f scripts/verify-psp-symbol-correlation.mjs; then
            format_files=(scripts/psp-symbol-correlation.mjs scripts/verify-psp-symbol-correlation.mjs scripts/verify-real-ghidra-mips.mjs docs/ghidra-psp.md knip.json)
          else
            format_files=(tests/conformance/ghidra/psp-fixture.mjs scripts/verify-real-ghidra-mips.mjs docs/ghidra-psp.md)
          fi
          if ! ./node_modules/.bin/oxfmt --check "${format_files[@]}"; then
            ./node_modules/.bin/oxfmt "${format_files[@]}"
            git diff -- "${format_files[@]}"
            exit 1
          fi
          npm run build:cached
          npm run check:fast
          npm run docs:check
      - name: Confirm upstream baseline repairs on the integrated source
        if: matrix.baseline == true
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check
          npm run test:focused -- tests/boundary/mcp/javascriptRuntimeObservationMcp.test.ts tests/boundary/process/providerVerifierCleanup.test.ts
      - name: Provision checksum-verified source-owned PSP toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 lld-18 binutils libgmp10 libmpfr6 libmpc3 libreadline-dev libusb-dev
          curl --fail --location --retry 2 --max-time 180 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o "$RUNNER_TEMP/psp-ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/psp-ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/psp-ghidra.zip" -d "$RUNNER_TEMP/psp-ghidra"
          GHIDRA_DIR="$RUNNER_TEMP/psp-ghidra/ghidra_12.1.3_PUBLIC"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/pspdev/pspdev/releases/download/v20261001/pspdev-ubuntu-latest-x86_64.tar.gz' -o "$RUNNER_TEMP/pspdev.tar.gz"
          echo "a86efe624e770005290919617859e9df24bd8fcd3e364f4587f23ec7364b0acd  $RUNNER_TEMP/pspdev.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/psp-tools"
          tar -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP/psp-tools"
          PSPDEV_DIR="$RUNNER_TEMP/psp-tools/pspdev"
          test -x "$PSPDEV_DIR/bin/psp-gcc"
          echo "PSPDEV=$PSPDEV_DIR" >> "$GITHUB_ENV"
          echo "$PSPDEV_DIR/bin" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/psp-runtime" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 90 'https://github.com/kotcrab/ghidra-allegrex/releases/download/v21.4/ghidra_12.1.3_PUBLIC_20260825_ghidra-allegrex.zip' -o "$RUNNER_TEMP/allegrex.zip"
          echo "62e829fa9e6ed6f2bd343763fb339a3f8812b02a4e0ed5a9409b14007b408243  $RUNNER_TEMP/allegrex.zip" | sha256sum --check
          mkdir -p "$GHIDRA_DIR/Ghidra/Extensions"
          unzip -q "$RUNNER_TEMP/allegrex.zip" -d "$GHIDRA_DIR/Ghidra/Extensions"
          test -f "$GHIDRA_DIR/Ghidra/Extensions/ghidra-allegrex/extension.properties"
      - name: Real public PSP CLI/MCP, Evidence, snapshot and cleanup verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra-mips.mjs --psp > "$RUNNER_TEMP/psp-results/report.json" 2> "$RUNNER_TEMP/psp-results/stderr.log" || {
            cat "$RUNNER_TEMP/psp-results/stderr.log" >&2
            exit 1
          }
          cat "$RUNNER_TEMP/psp-results/report.json"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psp-tooling-${{ matrix.feature }}
          path: ${{ runner.temp }}/psp-results/
          if-no-files-found: warn
          retention-days: 3
